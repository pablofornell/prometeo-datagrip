[package]
name = "dbcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Database core for Prometeo DataGrip: connections, introspection, execution, editing, DDL, export"

[dependencies]
oracledb = { path = "../../vendor/oracledb" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite"] }
libsqlite3-sys = "0.30"
tokio = { workspace = true }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
