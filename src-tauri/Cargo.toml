[package]
name = "prometeo-datagrip"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Prometeo DataGrip - a DataGrip clone built with Tauri 2"

[lib]
name = "prometeo_datagrip_lib"
# Desktop only: staticlib/cdylib are for Tauri mobile, and the MinGW linker cannot link a cdylib
# with this many exports ("export ordinal too large").
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "=3.0.12"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
dbcore = { path = "../crates/dbcore" }
keyring = { version = "3", default-features = false }
uuid = { version = "1", features = ["v4"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = "=0.2.5"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.2"

[dev-dependencies]
tempfile = "3"

# OS credential store per platform (without a native backend keyring 3 falls back to a mock store that forgets everything)
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
