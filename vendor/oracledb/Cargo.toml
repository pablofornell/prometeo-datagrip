# Vendored copy of the `oracledb` crate 26.0.0-beta.5 (https://github.com/oracle/rust-oracledb,
# UPL-1.0 OR Apache-2.0), with the changes listed in PATCHES.md. Library only; the user guide,
# tests, examples and helper binaries of the upstream crate are not included.
[package]
name = "oracledb"
version = "26.0.0-beta.5"
edition = "2024"
rust-version = "1.89"
authors = ["Oracle and/or its affiliates"]
description = "Lightweight driver for Oracle Database (vendored, patched)"
license = "UPL-1.0 OR Apache-2.0"
repository = "https://github.com/oracle/rust-oracledb"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "oracledb"
path = "src/lib.rs"
doctest = false

[features]
arrow = ["dep:arrow-array", "dep:arrow-schema"]

[dependencies]
aes = "0.9.1"
arrow-array = { version = "59.1.0", optional = true }
arrow-schema = { version = "59.1.0", optional = true }
base16ct = { version = "1.0.0", features = ["alloc"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
cbc = "0.2.1"
chrono = "0.4.45"
pbkdf2 = "0.13.0"
pkcs8 = { version = "0.11.0", features = ["pem", "encryption"] }
rand = "0.10.2"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
uuid = { version = "1.24.0", features = ["v4"] }
webpki-roots = "1.0.8"
whoami = "2.1.2"
